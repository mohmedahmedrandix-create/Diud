<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeModX - ألعاب وتطبيقات معدلة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #131b2e;
            --card-hover: #1c2742;
            --accent-green: #25ef75;
            --accent-hover: #1ed164;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        header {
            background-color: #0d1322;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo i {
            color: var(--accent-green);
            font-size: 28px;
        }

        .logo span {
            color: var(--accent-green);
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            display: flex;
            background: #172036;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            background: transparent;
            border: none;
            color: white;
            outline: none;
        }

        .search-bar button {
            background: var(--accent-green);
            border: none;
            padding: 0 20px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            gap: 4px;
        }

        nav a:hover, nav a.active {
            color: var(--accent-green);
        }

        .container {
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            margin-top: 30px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
        }

        .section-title i {
            color: var(--accent-green);
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 15px;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: 0.2s;
        }

        .app-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-green);
        }

        .app-icon-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .app-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            background: #252e48;
        }

        .app-details h4 {
            font-size: 14px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 110px;
        }

        .app-details span {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
        }

        .tag-badge {
            background: #1a2f26;
            color: var(--accent-green);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 4px;
            border: 1px solid rgba(37, 239, 117, 0.2);
        }

        .download-btn {
            background: var(--accent-green);
            color: #000;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .download-btn:hover {
            background: var(--accent-hover);
        }

        .empty-msg {
            color: var(--text-muted);
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <i class="fa-brands fa-android"></i> FreeMod<span>X</span>
        </a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="ابحث عن ألعاب وتطبيقات معدلة...">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <nav>
            <a href="#" class="active"><i class="fa-solid fa-house"></i>الرئيسية</a>
            <a href="#"><i class="fa-solid fa-gamepad"></i>الألعاب</a>
            <a href="#"><i class="fa-solid fa-border-all"></i>التطبيقات</a>
        </nav>
    </header>

    <div class="container">
        <!-- قسم الألعاب -->
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-gamepad"></i>
                <h3>الألعاب الشائعة</h3>
            </div>
        </div>
        <div class="apps-grid" id="gamesGrid">
            <!-- سيتم تعبئة الألعاب تلقائياً من ملف data.js -->
        </div>

        <!-- قسم التطبيقات -->
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-border-all"></i>
                <h3>التطبيقات الشائعة</h3>
            </div>
        </div>
        <div class="apps-grid" id="appsGrid">
            <!-- سيتم تعبئة التطبيقات تلقائياً من ملف data.js -->
        </div>
    </div>

    <!-- استدعاء ملف البيانات والسكริبت الخاص بالعرض -->
    <script src="data.js"></script>
    <script>
        // دالة لعرض الألعاب في الموقع
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            if (typeof gamesList === 'undefined' || gamesList.length === 0) {
                grid.innerHTML = '<div class="empty-msg">لا توجد ألعاب مضافة حالياً.</div>';
                return;
            }
            grid.innerHTML = gamesList.map(game => `
                <div class="app-card">
                    <div class="app-icon-row">
                        <img src="${game.icon}" class="app-icon" alt="${game.name}">
                        <div class="app-details">
                            <h4>${game.name}</h4>
                            <span>${game.version}</span>
                            <span class="tag-badge">${game.tag}</span>
                        </div>
                    </div>
                    <a href="${game.link}" class="download-btn" target="_blank">
                        <i class="fa-solid fa-download"></i> تحميل
                    </a>
                </div>
            `).join('');
        }

        // دالة لعرض التطبيقات في الموقع
        function renderApps() {
            const grid = document.getElementById('appsGrid');
            if (typeof appsList === 'undefined' || appsList.length === 0) {
                grid.innerHTML = '<div class="empty-msg">لا توجد تطبيقات مضافة حالياً.</div>';
                return;
            }
            grid.innerHTML = appsList.map(app => `
                <div class="app-card">
                    <div class="app-icon-row">
                        <img src="${app.icon}" class="app-icon" alt="${app.name}">
                        <div class="app-details">
                            <h4>${app.name}</h4>
                            <span>${app.version}</span>
                            <span class="tag-badge">${app.tag}</span>
                        </div>
                    </div>
                    <a href="${app.link}" class="download-btn" target="_blank">
                        <i class="fa-solid fa-download"></i> تحميل
                    </a>
                </div>
            `).join('');
        }

        // تشغيل الدوال عند تحميل الصفحة
        window.onload = function() {
            renderGames();
            renderApps();
        };
    </script>
</body>
</html>
